services:
  odin:
    container_name: odin
    image: aichenskyi/odin:latest
    ports:
      - "1234:1234"
    depends_on:
      - bor

  bor:
    container_name: bor
    build: ../bor
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - HNSWLIB_NO_NATIVE=1
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-granite3.3:8b}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-qwen3-embedding:0.6b}
      - MOCK=False
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - chroma_data:/etc/chroma
      - /home/raafisedyaporna/PT-Diorama-Products-Indonesia/odin_trial:/home/raafisedyaporna/PT-Diorama-Products-Indonesia/odin_trial:ro
    depends_on:
      - memgraph

  memgraph:
    image: memgraph/memgraph-mage:1.15-memgraph-2.15
    container_name: memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    environment:
      - MEMGRAPH="--log-level=TRACE"
    volumes:
      - mg_lib:/var/lib/memgraph

volumes:
  chroma_data:
  mg_lib:
